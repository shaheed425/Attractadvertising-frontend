
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      ATTRACT Advertising | Mobile LED Advertising in Kerala
    </title>

    <meta
      name="description"
      content="ATTRACT Advertising provides mobile LED backpack advertising, street campaigns, event promotions and brand activations across Kerala. Take your brand directly to the crowd. Contact us today."
    />

    <meta name="author" content="ATTRACT Advertising" />

    <meta name="robots" content="index, follow" />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://attractadvertising.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/attract.PNG"
    />

    <link
      rel="apple-touch-icon"
      href="/attract.PNG"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="ATTRACT Advertising"
    />

    <meta
      property="og:url"
      content="https://attractadvertising.in/"
    />

    <meta
      property="og:title"
      content="ATTRACT Advertising | Mobile LED Advertising in Kerala"
    />

    <meta
      property="og:description"
      content="Take your brand directly to the crowd with mobile LED backpack advertising, street campaigns, event promotions and brand activations across Kerala."
    />

    <meta
      property="og:image"
      content="https://attractadvertising.in/attract.PNG"
    />

    <meta
      property="og:image:alt"
      content="ATTRACT Advertising logo"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="ATTRACT Advertising | Mobile LED Advertising in Kerala"
    />

    <meta
      name="twitter:description"
      content="Mobile LED backpack advertising, street campaigns and brand activations across Kerala."
    />

    <meta
      name="twitter:image"
      content="https://attractadvertising.in/attract.PNG"
    />

    <meta
      name="twitter:image:alt"
      content="ATTRACT Advertising logo"
    />

    <!-- Structured Data: Website + Advertising Agency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://attractadvertising.in/#website",
          "url": "https://attractadvertising.in/",
          "name": "ATTRACT Advertising",
          "alternateName": "ATTRACT",
          "inLanguage": "en-IN",
          "publisher": {
            "@id": "https://attractadvertising.in/#business"
          }
        },
        {
          "@type": "AdvertisingAgency",
          "@id": "https://attractadvertising.in/#business",
          "name": "ATTRACT Advertising",
          "url": "https://attractadvertising.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://attractadvertising.in/attract.PNG"
          },
          "image": "https://attractadvertising.in/attract.PNG",
          "description": "ATTRACT Advertising provides mobile LED backpack advertising, street campaigns, event promotions and brand activations across Kerala, India.",
          "telephone": "+917034204464",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "Kerala",
            "addressCountry": "IN"
          },
          "areaServed": {
            "@type": "State",
            "name": "Kerala"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
